#cloud-config

users:
  - name: shrainer
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __SSH_KEY__

package_update: true

packages:
  - nginx

write_files:
  - path: /etc/nginx/sites-available/default
    permissions: '0644'
    content: |
      server {
          listen __PORT__ default_server;
          listen [::]:__PORT__ default_server;

          root /var/www/html;
          index index.html;

          location / {
              index index.html;
          }
      }

  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <meta charset="UTF-8">
          <title>__WORD__</title>
      </head>
      <body>
          <h1>__WORD__</h1>
          <p>Server: __SERVER_NAME__</p>
      </body>
      </html>

runcmd:
  - |
    DISK="/dev/vdb"

    if ! blkid "$DISK"; then
      mkfs.ext4 "$DISK"
    fi

    mkdir -p /mnt/data

    UUID=$(blkid -s UUID -o value "$DISK")

    if ! grep -q "$UUID" /etc/fstab; then
      echo "UUID=$UUID /mnt/data ext4 defaults,nofail 0 2" >> /etc/fstab
    fi

    mount -a

  - systemctl enable nginx
  - systemctl restart nginx
