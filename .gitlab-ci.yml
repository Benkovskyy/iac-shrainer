# Все задачи выполняются на своём раннере.
default:
  tags:
    - shrainer-06

stages:
  - proverka
  - stend

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.sh"
        - ".gitlab-ci.yml"
    - when: never
  script:
    - echo "Вариант 06, слово netlab"
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +

# Заготовка: утилиты, yc и профиль с ключом из переменной проекта
.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_DEV"
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# Ручная задача: проверяет доступ к облаку, ресурсов не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 06, слово netlab"
    - yc vpc network list

# Ручная задача: стенд второй работы — создать, проверить, снести
stend-p2:
  extends: .yc
  stage: stend
  when: manual
  variables:
    PREFIX: shrainer-06
    GREETING: netlab
    RUNNER_AFTER_SCRIPT_TIMEOUT: 15m
  script:
    - echo "Стенд второй работы из пайплайна, вариант 06, префикс $PREFIX, слово $GREETING"
    - mkdir -p ~/.ssh
    - ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
    - bash work-02/create.sh
    - bash work-02/check-lb.sh
  after_script:
    - export PATH=/usr/local/bin:$PATH
    - echo "Уборка стенда, префикс $PREFIX"
    - bash work-02/destroy.sh

# Проверка синтаксиса шаблона cloud-init
yamllint:
  stage: proverka
  image: alpine:3.20
  script:
    - apk add --no-cache yamllint >/dev/null
    - yamllint -d relaxed work-02/cloud-init.tpl.yaml
