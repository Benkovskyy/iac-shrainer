# Все задачи выполняются на своём раннере.
default:
  tags:
    - shrainer-06

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 06, слово netlab"
    - shellcheck --version
    - find . -name '*.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +

# Заготовка: утилиты, yc и профиль с ключом из переменной проекта
.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-keygen >/dev/null
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a -i /usr/local >/dev/null
    - export PATH=/usr/local/bin:$PATH
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_DEV"
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

# Ручная задача: проверяет доступ к облаку, ресурсов не создаёт
proverka-dostupa:
  extends: .yc
  stage: proverka
  when: manual
  script:
    - echo "Проверяю доступ, вариант 06, слово netlab"
    - yc vpc network list
