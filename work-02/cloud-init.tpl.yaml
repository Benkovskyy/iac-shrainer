#cloud-config

users:
  - name: shrainer
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - __SSH_KEY__

package_update: true

packages:
  - nginx

runcmd:
  - sed -i 's/listen 80 default_server;/listen __PORT__ default_server;/' /etc/nginx/sites-available/default
  - sed -i 's/listen \[::\]:80 default_server;/listen [::]:__PORT__ default_server;/' /etc/nginx/sites-available/default
  - bash -c 'echo "__GREETING__ on $(hostname)" > /var/www/html/index.nginx-debian.html'
  - nginx -t
  - systemctl restart nginx
